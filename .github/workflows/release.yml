name: Release plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify release version
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          test "$GITHUB_REF_NAME" = "$VERSION"
      - name: Attest main.js
        uses: actions/attest@v4
        with:
          subject-path: main.js
      - name: Attest manifest.json
        uses: actions/attest@v4
        with:
          subject-path: manifest.json
      - name: Attest styles.css
        uses: actions/attest@v4
        with:
          subject-path: styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --title "VaultMate $GITHUB_REF_NAME" --generate-notes
